# ─────────────────────────────────────────────────────────────────────────────
# Один сервис — сайт. Платформа проксирует на ПЕРВЫЙ сервис в этом файле, так
# что он здесь единственный и первый (документация Timeweb: «Проксирование
# настраивается только для первого сервиса»).
#
# Порты 80 и 443 занимать нельзя — они у платформы под её веб-сервером, который
# принимает HTTPS и выдаёт сертификат Let's Encrypt. Мы слушаем 8080 обычным
# HTTP внутри, снаружи всё равно только https://grafik.one.
#
# volumes здесь нет и быть не может (платформа их запрещает) — и не нужно:
# сайт целиком лежит в образе, состояния у него нет, вся жизнь в Supabase.
# ─────────────────────────────────────────────────────────────────────────────
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      # Проверяем НЕ «порт открыт», а что отдаётся настоящая страница входа.
      # 06.08 сайт отвечал 200 и показывал людям маркеры конфликта — пинг был
      # бы зелёным. Поэтому смотрим на содержимое.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
